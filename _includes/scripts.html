<!-- third party scripts, served by this site (unpkg.com is unreliable in mainland China; see libs/README.md) -->
<script src="{{ '/libs/js/popper.min.js' | relative_url }}" defer></script>
<script src="{{ '/libs/js/tippy-bundle.umd.min.js' | relative_url }}" defer></script>
<script src="{{ '/libs/js/mark.min.js' | relative_url }}" defer></script>

<!-- include all js in scripts folder -->
{% assign scripts = site.static_files | where_exp: "file", "file.path contains '/_scripts'" %}
{% for script in scripts %}
  <script src="{{ script.path | relative_url }}?v={{ site.time | date: '%s' }}"></script>
{% endfor %}
