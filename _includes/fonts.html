<!-- Fonts and icons are served by this site itself, not by Google Fonts or Font Awesome's servers:
     those are blocked in mainland China, where they left pages blank until the browser gave up.
     See libs/README.md. -->
<link rel="preload" href="{{ '/libs/fonts/barlow-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/libs/fonts/barlow-latin-600-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link href="{{ '/libs/fonts/fonts.css' | relative_url }}" rel="stylesheet">

<!-- Font Awesome icons (load asynchronously due to size) -->
{% assign fontawesome = "/libs/fontawesome/css/all.min.css" | relative_url %}
<link
  href="{{ fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ fontawesome }}" rel="stylesheet">
</noscript>
